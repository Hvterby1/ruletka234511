[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-starter"
version = "0.1.0"
description = "Starter Python project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.0.0",
  "aiosqlite>=0.20.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
python-starter = "python_starter.bot:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
